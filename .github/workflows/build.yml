name: Build APK

on:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: تحميل المشروع
        uses: actions/checkout@v4

      - name: تثبيت Buildozer
        run: |
          sudo apt update
          sudo apt install -y python3-pip build-essential git
          pip3 install buildozer

      - name: بناء APK
        run: |
          buildozer android debug
